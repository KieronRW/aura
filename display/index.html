<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300&family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">

  <style>
    :root {
      --status-bar-height: 90px;
      --status-bar-scale:  1;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: none;
    }

    .screen {
      position: fixed;
      inset: 0 0 calc(var(--status-bar-height) * var(--status-bar-scale)) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      pointer-events: none;
      background: #000000;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ================================================================
       IDLE SCREEN
    ================================================================ */

    #idle-screen { overflow: hidden; }

    .rings {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ring-1 { width: 65vw;  height: 65vw;  animation: ring-breathe 5s ease-in-out infinite 0s; }
    .ring-2 { width: 95vw;  height: 95vw;  animation: ring-breathe 5s ease-in-out infinite 1s; }
    .ring-3 { width: 130vw; height: 130vw; animation: ring-breathe 5s ease-in-out infinite 2s; }

    @keyframes ring-breathe {
      0%, 100% { opacity: 0.12; transform: scale(0.97); }
      50%       { opacity: 0.50; transform: scale(1.03); }
    }

    .idle-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .aura-logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 200;
      font-size: 24vw;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1;
      animation: logo-glow 5s ease-in-out infinite;
    }

    .aura-rule {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.22), transparent);
      margin: 2.8rem auto;
      animation: rule-breathe 5s ease-in-out infinite;
    }

    .aura-tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: clamp(0.7rem, 1.8vw, 1.3rem);
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.2);
      animation: fade-breathe 5s ease-in-out infinite;
      animation-delay: 0.5s;
    }

    @keyframes logo-glow {
      0%, 100% {
        text-shadow: 0 0 20px rgba(255,255,255,0.06), 0 0 60px rgba(255,255,255,0.03);
        opacity: 0.40;
      }
      50% {
        text-shadow: 0 0 30px rgba(255,255,255,0.65), 0 0 80px rgba(255,255,255,0.30), 0 0 150px rgba(210,230,255,0.14);
        opacity: 1;
      }
    }

    @keyframes rule-breathe {
      0%, 100% { opacity: 0.15; transform: scaleY(0.45); }
      50%       { opacity: 0.55; transform: scaleY(1.00); }
    }

    @keyframes fade-breathe {
      0%, 100% { opacity: 0.10; }
      50%       { opacity: 0.32; }
    }

    /* ================================================================
       RECOGNITION SCREEN
    ================================================================ */

    #recognition-screen {
      gap: 0;
      padding: 0 6vw;
    }

    .rec-make-model {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: clamp(0.75rem, 2.2vw, 1.4rem);
      letter-spacing: 0.48em;
      padding-left: 0.48em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
      margin-bottom: 7vh;
      text-align: center;
    }

    .badge-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1100px;       /* only affects the PNG wrappers' 3D transforms */
      perspective-origin: 50% 50%;
    }

    .badge-float {
      animation: badge-float 6s ease-in-out infinite;
    }

    .badge-spin {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: badge-spin-y 9s linear infinite;
      transform-style: preserve-3d;
    }

    /* PNG badge — kept for backwards compatibility */
    .badge-img {
      display: block;
      width: 70vw;
      max-width: 756px;
      height: auto;
      filter: none;
    }

    .badge-img.hidden { display: none; }
    .badge-reflection { display: none; }

    /* GLB badge canvas — MUST stay outside any CSS spin/float/transform;
       all motion comes from the Three.js camera orbit, not CSS. */
    #badge-canvas {
      display: none;
      width: 70vw;
      max-width: 756px;
      height: 70vw;
      max-height: 756px;
      background: transparent;
    }

    #badge-canvas.active { display: block; }

    @keyframes badge-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    @keyframes badge-spin-y {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    .badge-floor-glow { display: none; }

    .rec-greeting {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.6rem, 5vw, 4rem);
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.04em;
      text-align: center;
      margin-top: 7vh;
      max-width: 88vw;
    }

    /* ================================================================
       VISITOR SCREEN
    ================================================================ */

    #visitor-screen { padding: 0 10vw; }

    .visitor-message {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.6rem, 5vw, 4rem);
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.04em;
      text-align: center;
      max-width: 88vw;
    }

    /* ================================================================
       WS STATUS DOT
    ================================================================ */

    #ws-dot {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      transition: background 0.6s ease-in-out;
    }

    #ws-dot.connected    { background: rgba(255, 255, 255, 0.40); }
    #ws-dot.reconnecting { background: rgba(200, 160, 60, 0.65); animation: dot-blink 1s ease-in-out infinite; }
    #ws-dot.error        { background: rgba(200, 60, 60, 0.65); }

    @keyframes dot-blink {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.2; }
    }

    /* ================================================================
       STATUS BAR
    ================================================================ */

    #status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--status-bar-height) * var(--status-bar-scale));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: #000;
      color: rgba(255, 255, 255, 0.4);
      font-size: calc(24px * var(--status-bar-scale));
      font-weight: 300;
      letter-spacing: 2px;
      z-index: 100;
    }

    #status-weather svg {
      width:  calc(32px * var(--status-bar-scale));
      height: calc(32px * var(--status-bar-scale));
      flex-shrink: 0;
    }

    #status-time, #status-weather { display: none; }

    /* ================================================================
       WEATHER ICON ANIMATIONS
    ================================================================ */

    @keyframes wx-spin  { to { transform: rotate(360deg); } }
    @keyframes wx-drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    @keyframes wx-rain  { from { transform: translateY(0); opacity: .7; } to { transform: translateY(9px); opacity: 0; } }
    @keyframes wx-snow  { 0% { transform: translate(0,0); opacity: .7; } 100% { transform: translate(3px,11px); opacity: 0; } }
    @keyframes wx-fog   { 0%,100% { opacity: .2; } 50% { opacity: .65; } }
    @keyframes wx-flash {
      0%,85%,90%,95%,100% { opacity: .55; }
      86%,91%,96%          { opacity: .05; }
      87%,92%,97%          { opacity: 1;   }
    }

    .wx-spin   { animation: wx-spin  60s linear     infinite; transform-origin: 16px 16px; }
    .wx-drift  { animation: wx-drift  4s ease-in-out infinite; }
    .wx-fog    { animation: wx-fog    2s ease-in-out infinite; }
    .wx-flash  { animation: wx-flash  6s ease-in-out infinite; }
    .wx-rain-1 { animation: wx-rain   1s linear infinite 0s;   }
    .wx-rain-2 { animation: wx-rain   1s linear infinite .33s; }
    .wx-rain-3 { animation: wx-rain   1s linear infinite .66s; }
    .wx-snow-1 { animation: wx-snow   3s ease-in-out infinite 0s; }
    .wx-snow-2 { animation: wx-snow   3s ease-in-out infinite 1s; }
    .wx-snow-3 { animation: wx-snow   3s ease-in-out infinite 2s; }
  </style>
</head>

<body>

  <!-- ── Idle screen ───────────────────────────────────────────────── -->
  <div id="idle-screen" class="screen active">
    <div class="rings">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <div class="idle-content">
      <div class="aura-logo">AURA</div>
      <div class="aura-rule"></div>
      <div class="aura-tagline">Autonomous Vehicle Recognition</div>
    </div>
  </div>

  <!-- ── Recognition screen ───────────────────────────────────────── -->
  <div id="recognition-screen" class="screen">
    <div class="rec-make-model" id="rec-make-model"></div>

    <div class="badge-stage">
      <!-- PNG fallback keeps its CSS float/spin -->
      <div class="badge-float">
        <div class="badge-spin">
          <img class="badge-img hidden" id="rec-badge" src="" alt="Vehicle badge">
          <img class="badge-reflection hidden" id="rec-reflect" src="" alt="">
        </div>
      </div>
      <!-- GLB canvas: static, OUTSIDE the CSS spin/float — motion is the WebGL camera orbit -->
      <canvas id="badge-canvas"></canvas>
    </div>

    <div class="badge-floor-glow"></div>
    <div class="rec-greeting" id="rec-greeting"></div>
  </div>

  <!-- ── Visitor pre-arrival screen ──────────────────────────────── -->
  <div id="visitor-screen" class="screen">
    <div class="visitor-message" id="visitor-message"></div>
  </div>

  <!-- ── Status bar ── -->
  <div id="status-bar">
    <div id="status-time"></div>
    <div id="status-weather"></div>
  </div>

  <div id="ws-dot"></div>

  <!-- Modern three.js (r160) vendored locally — ESM via importmap. Chrome 148 on
       the Pi supports importmaps natively; every path resolves to a local file. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/display/vendor/three.module.js",
      "three/addons/": "/display/vendor/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // ── DOM refs ────────────────────────────────────────────────────
    const idleScreen     = document.getElementById('idle-screen');
    const recScreen      = document.getElementById('recognition-screen');
    const visitorScreen  = document.getElementById('visitor-screen');
    const recMM          = document.getElementById('rec-make-model');
    const recBadge       = document.getElementById('rec-badge');
    const recReflect     = document.getElementById('rec-reflect');
    const recGreeting    = document.getElementById('rec-greeting');
    const visitorMessage = document.getElementById('visitor-message');
    const wsDot          = document.getElementById('ws-dot');
    const badgeCanvas    = document.getElementById('badge-canvas');

    const WS_URL          = 'ws://localhost:8765';
    const RECONNECT_DELAY = 4000;

    let currentState        = 'idle';
    let reconnectTimer      = null;
    let ws                  = null;
    let manualOverride      = false;
    let isVisitorModeActive = false;

    // ── Three.js GLB renderer ───────────────────────────────────────

    let glbRenderer  = null;
    let glbScene     = null;
    let glbCamera    = null;
    let glbBadge     = null;
    let glbAnimId    = null;
    let glbFitSize   = null;   // centred+scaled bbox size, for camera fitting
    let glbEnvMap    = null;   // PMREM env texture, assigned per-material
    let glbCamDist = null;          // fixed camera distance on +Z (from fitCamera)
    const SPIN_PERIOD_MS = 20000;   // ~20s per full badge Y-axis rotation (premium pace)
    const FIT_MARGIN     = 1.3;     // camera distance beyond the tight sphere fit

    function initGLBRenderer() {
      if (glbRenderer) return;

      glbRenderer = new THREE.WebGLRenderer({
        canvas: badgeCanvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      glbRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      glbRenderer.setClearColor(0x000000, 0); // fully transparent — pure black shows through
      // Modern three: colour management is on by default; SRGBColorSpace is the
      // default output (set explicitly for clarity). physicallyCorrectLights is
      // gone — lighting is always physically correct now.
      glbRenderer.outputColorSpace = THREE.SRGBColorSpace;
      // Match donmccurdy/three-gltf-viewer's proven pipeline: Linear tone mapping,
      // exposure 2^0 = 1.0. Applies to geometry only — clear colour untouched.
      glbRenderer.toneMapping = THREE.LinearToneMapping;
      glbRenderer.toneMappingExposure = Math.pow(2, 0.0);

      glbScene  = new THREE.Scene();
      glbCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      glbCamera.position.set(0, 0, 3);
      // Lights are parented to the camera (below), so the camera itself must be
      // in the scene graph for them to contribute to lighting.
      glbScene.add(glbCamera);

      // Neutral IBL environment, exactly as the reference viewer: RoomEnvironment
      // → PMREM → scene.environment (default sigma). CONSTRAINT: scene.background
      // stays null so the canvas stays transparent — env is reflections/IBL only.
      const pmrem = new THREE.PMREMGenerator(glbRenderer);
      glbEnvMap = pmrem.fromScene(new RoomEnvironment()).texture;
      glbScene.environment = glbEnvMap;
      glbScene.background  = null;
      pmrem.dispose();

      // Lighting copied from the reference viewer's addLights(): a soft ambient
      // plus one bright key directional, BOTH PARENTED TO THE CAMERA so the lit
      // side always faces the viewer as the camera orbits. This is the key fix —
      // our previous world-fixed lights let the chrome go dark at off angles.
      const ambient = new THREE.AmbientLight(0xffffff, 0.3);
      glbCamera.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffffff, 0.8 * Math.PI);
      keyLight.position.set(0.5, 0, 0.866); // ~60° off the camera axis
      glbCamera.add(keyLight);

      function resizeGLB() {
        const w = badgeCanvas.clientWidth;
        const h = badgeCanvas.clientHeight;
        if (badgeCanvas.width !== w || badgeCanvas.height !== h) {
          glbRenderer.setSize(w, h, false);
          glbCamera.aspect = w / h;
          glbCamera.updateProjectionMatrix();
          fitCamera();
        }
      }
      resizeGLB();
      window.addEventListener('resize', resizeGLB);
    }

    // Fit the camera so the whole badge stays framed, for any badge proportions.
    // We fit to the badge's bounding SPHERE (invariant to its Y-spin), then place
    // the camera straight-on on the +Z axis looking at the centre. The badge spins
    // on its own Y axis (in the loop); the camera itself stays fixed perpendicular.
    function fitCamera() {
      if (!glbFitSize || !glbCamera) return;
      const w = badgeCanvas.clientWidth, h = badgeCanvas.clientHeight;
      const aspect = (w && h) ? w / h : 1;
      glbCamera.aspect = aspect;                       // keep projection un-stretched
      const fovV = glbCamera.fov * Math.PI / 180;
      const fovH = 2 * Math.atan(Math.tan(fovV / 2) * aspect);
      const halfMin = Math.min(fovV, fovH) / 2;        // limiting half-FOV
      // Bounding-SPHERE radius — invariant to the badge's Y-spin.
      const R = 0.5 * Math.sqrt(
        glbFitSize.x * glbFitSize.x +
        glbFitSize.y * glbFitSize.y +
        glbFitSize.z * glbFitSize.z
      );
      // Fixed camera distance: tight sphere fit × margin, so the badge is fully
      // framed and the camera stays well outside it (can never near-clip).
      glbCamDist = (R / Math.sin(halfMin)) * FIT_MARGIN;
      glbCamera.near = Math.max(0.01, glbCamDist - R - 0.1);
      glbCamera.far  = glbCamDist + R + 1;
      // Straight-on perpendicular front view on the +Z axis (no elevation).
      glbCamera.position.set(0, 0, glbCamDist);
      glbCamera.up.set(0, 1, 0);
      glbCamera.lookAt(0, 0, 0);
      glbCamera.updateProjectionMatrix();
    }

    function loadGLB(url) {
      // Canvas must be display:block before the renderer sizes itself,
      // otherwise clientWidth/clientHeight are 0 on the first load (0×0 buffer).
      recBadge.classList.add('hidden');
      badgeCanvas.classList.add('active');

      initGLBRenderer();

      if (glbBadge) {
        glbScene.remove(glbBadge);
        glbBadge = null;
      }

      const loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);
      loader.load(
        url,
        (gltf) => {
          glbBadge = gltf.scene;

          // Normalise scale first, then recentre the scaled model on the origin
          // (the Y-spin pivot), then fit the camera to the real bounding box.
          const box0   = new THREE.Box3().setFromObject(glbBadge);
          const maxDim = Math.max(...box0.getSize(new THREE.Vector3()).toArray());
          glbBadge.scale.setScalar(1.5 / maxDim);

          const box1   = new THREE.Box3().setFromObject(glbBadge);
          glbBadge.position.sub(box1.getCenter(new THREE.Vector3()));

          const box2   = new THREE.Box3().setFromObject(glbBadge);
          glbFitSize   = box2.getSize(new THREE.Vector3());

          glbScene.add(glbBadge);
          fitCamera();

          // r128 does not reliably propagate scene.environment to models loaded
          // after it was set, so assign the PMREM env map to every material
          // directly — without this the chrome (metal=1) reflects nothing.
          glbBadge.traverse((o) => {
            if (!o.isMesh) return;
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach((m) => {
              m.envMap = glbEnvMap;
              m.envMapIntensity = 1.0;
              m.needsUpdate = true;
            });
          });

          startGLBLoop();
        },
        undefined,
        (err) => {
          console.error('GLTFLoader error:', err);
          badgeCanvas.classList.remove('active');
        }
      );
    }

    function startGLBLoop() {
      if (glbAnimId) cancelAnimationFrame(glbAnimId);

      function animate() {
        glbAnimId = requestAnimationFrame(animate);
        if (glbBadge) {
          // Camera stays fixed & perpendicular; spin the badge on its own Y axis.
          glbBadge.rotation.y = (Date.now() % SPIN_PERIOD_MS) / SPIN_PERIOD_MS * Math.PI * 2;
        }
        glbRenderer.render(glbScene, glbCamera);
      }
      animate();
    }

    function stopGLBLoop() {
      if (glbAnimId) {
        cancelAnimationFrame(glbAnimId);
        glbAnimId = null;
      }
    }

    // ── Badge routing ───────────────────────────────────────────────

    function applyBadge(url) {
      if (!url) {
        recBadge.classList.add('hidden');
        badgeCanvas.classList.remove('active');
        stopGLBLoop();
        return;
      }

      if (url.toLowerCase().endsWith('.glb')) {
        stopGLBLoop();
        loadGLB(url);
      } else {
        stopGLBLoop();
        badgeCanvas.classList.remove('active');
        recBadge.src = url;
        recBadge.classList.remove('hidden');
      }

      recReflect.classList.add('hidden');
      idleScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      recScreen.classList.add('active');
    }

    // ── Screen transitions ──────────────────────────────────────────

    function showIdle(force = false) {
      if (!force && manualOverride) return;
      if (currentState === 'idle') return;
      if (!force && isVisitorModeActive) return;
      stopGLBLoop();
      currentState = 'idle';
      recScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      idleScreen.classList.add('active');
    }

    function showVisitorPreArrival(data) {
      isVisitorModeActive = true;
      currentState = 'visitor_pre_arrival';
      visitorMessage.textContent = data.message || '';
      idleScreen.classList.remove('active');
      recScreen.classList.remove('active');
      visitorScreen.classList.add('active');
    }

    function showVisitorBayOccupied(data) {
      currentState = 'visitor_bay_occupied';
      visitorMessage.textContent = data.message || '';
      idleScreen.classList.remove('active');
      recScreen.classList.remove('active');
      visitorScreen.classList.add('active');
    }

    function showVisitorModeEnded() {
      isVisitorModeActive = false;
      currentState = 'idle';
      recScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      idleScreen.classList.add('active');
    }

    function showRecognition(data) {
      currentState = 'recognition';
      idleScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      recScreen.classList.add('active');

      const parts = [data.make, data.model].filter(Boolean);
      recMM.textContent       = parts.join('  ·  ');
      recGreeting.textContent = data.greeting || '';

      if (data.badge_url) {
        if (data.badge_url.toLowerCase().endsWith('.glb')) {
          applyBadge(data.badge_url);
        } else {
          const probe = new Image();
          probe.onload  = () => { applyBadge(data.badge_url); };
          probe.onerror = () => { applyBadge(null); };
          probe.src = data.badge_url;
        }
      } else {
        applyBadge(null);
      }
    }

    // ── Status bar ──────────────────────────────────────────────────

    const statusTime     = document.getElementById('status-time');
    const statusWeather  = document.getElementById('status-weather');
    let _timeInterval    = null;
    let _lastWeatherCode = null;

    const _WX_ATTRS = `fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"`;
    const _WX_SVG   = (body) => `<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" ${_WX_ATTRS}>${body}</svg>`;
    const _CLOUD_SM = `<path d="M3,18 Q3,12 8,12 Q8,8 13,8 Q18,8 20,12 Q26,12 26,16 Q26,18 23,18 Z"/>`;
    const _CLOUD_LG = `<path d="M3,23 Q3,16 9,16 Q9,11 15,11 Q21,11 23,16 Q29,16 29,20 Q29,23 26,23 Z"/>`;

    function getWeatherIcon(code) {
      if (code == null)               return _wxDefault();
      if (code === 0)                 return _wxClear();
      if (code <= 2)                  return _wxPartlyCloudy();
      if (code === 3)                 return _wxCloudy();
      if (code === 45 || code === 48) return _wxFog();
      if (code <= 67)                 return _wxRain();
      if (code <= 77)                 return _wxSnow();
      if (code <= 82)                 return _wxRain();
      if (code <= 86)                 return _wxSnow();
      if (code <= 99)                 return _wxThunderstorm();
      return _wxDefault();
    }

    function _wxClear() {
      return _WX_SVG(`<g class="wx-spin">
        <circle cx="16" cy="16" r="5"/>
        <line x1="16" y1="2"  x2="16" y2="8"/><line x1="16" y1="24" x2="16" y2="30"/>
        <line x1="2"  y1="16" x2="8"  y2="16"/><line x1="24" y1="16" x2="30" y2="16"/>
        <line x1="6.1"  y1="6.1"  x2="10.5" y2="10.5"/><line x1="21.5" y1="21.5" x2="25.9" y2="25.9"/>
        <line x1="25.9" y1="6.1"  x2="21.5" y2="10.5"/><line x1="6.1"  y1="25.9" x2="10.5" y2="21.5"/>
      </g>`);
    }

    function _wxPartlyCloudy() {
      return _WX_SVG(`
        <circle cx="21" cy="11" r="4"/>
        <line x1="21" y1="4"    x2="21" y2="6"/>   <line x1="21" y1="16"   x2="21"   y2="18"/>
        <line x1="14" y1="11"   x2="16" y2="11"/>  <line x1="26" y1="11"   x2="28"   y2="11"/>
        <line x1="15.5" y1="5.5" x2="17" y2="7"/>  <line x1="25" y1="15"   x2="26.5" y2="16.5"/>
        <line x1="26.5" y1="5.5" x2="25" y2="7"/>  <line x1="15.5" y1="16.5" x2="17" y2="15"/>
        <g class="wx-drift">
          <path d="M2,26 Q2,20 8,20 Q8,16 13,16 Q19,16 21,20 Q26,20 26,24 Q26,26 22,26 Z"
                fill="#000" stroke="rgba(255,255,255,0.6)"/>
        </g>`);
    }

    function _wxCloudy() { return _WX_SVG(`<g class="wx-drift">${_CLOUD_LG}</g>`); }

    function _wxFog() {
      return _WX_SVG(`<g class="wx-fog">
        <path d="M3,10 Q8,8  13,10 Q18,12 23,10 Q27,9  31,10"/>
        <path d="M3,17 Q8,15 13,17 Q18,19 23,17 Q27,16 31,17"/>
        <path d="M3,24 Q8,22 13,24 Q18,26 23,24 Q27,23 31,24"/>
      </g>`);
    }

    function _wxRain() {
      return _WX_SVG(`${_CLOUD_SM}
        <line class="wx-rain-1" x1="9"  y1="22" x2="7"  y2="28"/>
        <line class="wx-rain-2" x1="15" y1="22" x2="13" y2="28"/>
        <line class="wx-rain-3" x1="21" y1="22" x2="19" y2="28"/>`);
    }

    function _wxSnow() {
      return _WX_SVG(`${_CLOUD_SM}
        <circle class="wx-snow-1" cx="9"  cy="23" r="1.5" fill="rgba(255,255,255,0.6)" stroke="none"/>
        <circle class="wx-snow-2" cx="15" cy="23" r="1.5" fill="rgba(255,255,255,0.6)" stroke="none"/>
        <circle class="wx-snow-3" cx="21" cy="23" r="1.5" fill="rgba(255,255,255,0.6)" stroke="none"/>`);
    }

    function _wxThunderstorm() {
      return _WX_SVG(`
        <path d="M3,17 Q3,11 8,11 Q8,7 13,7 Q18,7 20,11 Q26,11 26,15 Q26,17 23,17 Z"/>
        <path class="wx-flash" d="M18,19 L13,25 L17,25 L15,31 L22,22 L17,22 Z" fill="rgba(255,255,255,0.6)" stroke="none"/>`);
    }

    function _wxDefault() { return _WX_SVG(`<circle cx="16" cy="16" r="12"/>`); }

    function updateStatusBar(msg) {
      if (msg.status_bar_scale != null) {
        document.documentElement.style.setProperty('--status-bar-scale', (msg.status_bar_scale / 100).toFixed(2));
      }

      if (msg.show_time) {
        statusTime.style.display = 'block';
        clearInterval(_timeInterval);
        const _DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const _MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        function _ordinal(d) {
          if (d >= 11 && d <= 13) return d + 'th';
          switch (d % 10) { case 1: return d+'st'; case 2: return d+'nd'; case 3: return d+'rd'; default: return d+'th'; }
        }
        function _tick() {
          const now      = new Date();
          const datePart = _DAYS[now.getDay()] + ' ' + _ordinal(now.getDate()) + ' ' + _MONTHS[now.getMonth()];
          let timePart;
          if (msg.time_format === '12h') {
            const h = now.getHours() % 12 || 12;
            const m = String(now.getMinutes()).padStart(2, '0');
            timePart = `${h}:${m} ${now.getHours() < 12 ? 'AM' : 'PM'}`;
          } else {
            timePart = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
          }
          statusTime.textContent = `${datePart} · ${timePart}`;
        }
        _tick();
        _timeInterval = setInterval(_tick, 1000);
      } else {
        clearInterval(_timeInterval);
        _timeInterval = null;
        statusTime.style.display = 'none';
        statusTime.textContent   = '';
      }

      if (msg.show_weather && msg.temp_c != null) {
        statusWeather.style.display    = 'inline-flex';
        statusWeather.style.alignItems = 'center';
        statusWeather.style.gap        = '8px';
        const tempStr = msg.units === 'imperial'
          ? Math.round(msg.temp_c * 9/5 + 32) + '°F'
          : Math.round(msg.temp_c) + '°C';
        const code = (msg.weather_code != null) ? msg.weather_code : null;
        if (code !== _lastWeatherCode) {
          _lastWeatherCode = code;
          statusWeather.innerHTML = getWeatherIcon(code) + `<span>${tempStr}</span>`;
        } else {
          const span = statusWeather.querySelector('span');
          if (span) span.textContent = tempStr;
          else statusWeather.innerHTML = getWeatherIcon(code) + `<span>${tempStr}</span>`;
        }
      } else {
        _lastWeatherCode = null;
        statusWeather.style.display = 'none';
        statusWeather.innerHTML     = '';
      }
    }

    // ── Spacebar test mode ──────────────────────────────────────────

    document.addEventListener('keydown', (e) => {
      if (e.code !== 'Space') return;
      e.preventDefault();
      if (currentState !== 'idle') {
        manualOverride = false;
        showIdle(true);
      } else {
        manualOverride = true;
        currentState = 'recognition';
        recMM.textContent       = 'Volkswagen  ·  Polo Vivo';
        recGreeting.textContent = 'Welcome back, Kieron';
        applyBadge('http://localhost:8080/assets/badges/volkswagen.glb');
      }
    });

    // ── WebSocket ───────────────────────────────────────────────────

    function connect() {
      clearTimeout(reconnectTimer);
      wsDot.className = 'reconnecting';
      ws = new WebSocket(WS_URL);
      ws.addEventListener('open', () => {
        wsDot.className = 'connected';
        isVisitorModeActive = false;
      });
      ws.addEventListener('message', ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { return; }
        if      (msg.state === 'recognition')          showRecognition(msg);
        else if (msg.state === 'status_bar')           updateStatusBar(msg);
        else if (msg.state === 'visitor_pre_arrival')  showVisitorPreArrival(msg);
        else if (msg.state === 'visitor_bay_occupied') showVisitorBayOccupied(msg);
        else if (msg.state === 'visitor_mode_ended')   showVisitorModeEnded();
        else                                           showIdle();
      });
      ws.addEventListener('close', () => {
        wsDot.className = 'reconnecting';
        showIdle();
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
      });
      ws.addEventListener('error', () => {
        wsDot.className = 'error';
        ws.close();
      });
    }

    connect();
  </script>
</body>
</html>
