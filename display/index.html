<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300&family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">

  <style>
    :root {
      --status-bar-height: 90px;
      --status-bar-scale:  1;   /* updated by JS from msg.status_bar_scale / 100 */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;   /* pure black — critical for one-way mirror */
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: none;
    }

    /* ================================================================
       SCREENS
    ================================================================ */

    .screen {
      position: fixed;
      inset: 0 0 calc(var(--status-bar-height) * var(--status-bar-scale)) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      pointer-events: none;
      background: #000000;   /* each screen is also pure black */
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ================================================================
       IDLE SCREEN
       Portrait-first: 1080 × 1920
    ================================================================ */

    #idle-screen {
      overflow: hidden;
    }

    /* Concentric rings */
    .rings {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ring-1 { width: 65vw;  height: 65vw;  animation: ring-breathe 5s ease-in-out infinite 0s; }
    .ring-2 { width: 95vw;  height: 95vw;  animation: ring-breathe 5s ease-in-out infinite 1s; }
    .ring-3 { width: 130vw; height: 130vw; animation: ring-breathe 5s ease-in-out infinite 2s; }

    @keyframes ring-breathe {
      0%, 100% { opacity: 0.12; transform: scale(0.97); }
      50%       { opacity: 0.50; transform: scale(1.03); }
    }

    .idle-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .aura-logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 200;
      font-size: 24vw;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1;
      transform: none;
      animation: logo-glow 5s ease-in-out infinite;
    }

    .aura-rule {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.22), transparent);
      margin: 2.8rem auto;
      transform-origin: center;
      animation: rule-breathe 5s ease-in-out infinite;
    }

    .aura-tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: clamp(0.7rem, 1.8vw, 1.3rem);
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.2);
      animation: fade-breathe 5s ease-in-out infinite;
      animation-delay: 0.5s;
    }

    @keyframes logo-glow {
      0%, 100% {
        text-shadow:
          0 0 20px  rgba(255, 255, 255, 0.06),
          0 0 60px  rgba(255, 255, 255, 0.03);
        opacity: 0.40;
      }
      50% {
        text-shadow:
          0 0 30px  rgba(255, 255, 255, 0.65),
          0 0 80px  rgba(255, 255, 255, 0.30),
          0 0 150px rgba(210, 230, 255, 0.14);
        opacity: 1;
      }
    }

    @keyframes rule-breathe {
      0%, 100% { opacity: 0.15; transform: scaleY(0.45); }
      50%       { opacity: 0.55; transform: scaleY(1.00); }
    }

    @keyframes fade-breathe {
      0%, 100% { opacity: 0.10; }
      50%       { opacity: 0.32; }
    }

    /* ================================================================
       RECOGNITION SCREEN
       Mirror-safe: no drop-shadows, no glows, no reflections,
       no gradients that bleed through the glass.
    ================================================================ */

    #recognition-screen {
      gap: 0;
      padding: 0 6vw;
    }

    /* Make · Model — small caps above the badge */
    .rec-make-model {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: clamp(0.75rem, 2.2vw, 1.4rem);
      letter-spacing: 0.48em;
      padding-left: 0.48em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
      margin-bottom: 7vh;
      text-align: center;
    }

    /* Perspective container for 3-D Y-spin */
    .badge-stage {
      perspective: 1100px;
      perspective-origin: 50% 50%;
    }

    /* Float: subtle vertical drift */
    .badge-float {
      animation: badge-float 6s ease-in-out infinite;
    }

    /* Spin: linear for smooth continuous rotation */
    .badge-spin {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: badge-spin-y 9s linear infinite;
      transform-style: preserve-3d;
    }

    /*
     * Badge image — pure white, no drop-shadow or glow.
     * Shadows and halos bleed through a one-way mirror; brightness(0) invert(1)
     * converts the logo to pure white which is sufficient for mirror visibility.
     */
    .badge-img {
      display: block;
      width: 70vw;
      max-width: 756px;
      height: auto;
      filter: none;
    }

    .badge-img.hidden { display: none; }

    /* Reflection removed — bleeds through mirror glass */
    .badge-reflection { display: none; }

    @keyframes badge-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    @keyframes badge-spin-y {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    /* Floor glow removed — bleeds through mirror glass */
    .badge-floor-glow { display: none; }

    /* Greeting */
    .rec-greeting {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.6rem, 5vw, 4rem);
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.04em;
      text-align: center;
      margin-top: 7vh;
      max-width: 88vw;
    }

    /* ================================================================
       VISITOR PRE-ARRIVAL SCREEN
    ================================================================ */

    #visitor-screen {
      padding: 0 10vw;
    }

    .visitor-message {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.6rem, 5vw, 4rem);
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.04em;
      text-align: center;
      max-width: 88vw;
    }

    /* ================================================================
       WS STATUS DOT
    ================================================================ */

    #ws-dot {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      transition: background 0.6s ease-in-out;
    }

    #ws-dot.connected    { background: rgba(255, 255, 255, 0.40); }
    #ws-dot.reconnecting { background: rgba(200, 160, 60, 0.65); animation: dot-blink 1s ease-in-out infinite; }
    #ws-dot.error        { background: rgba(200, 60,  60, 0.65); }

    @keyframes dot-blink {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.2; }
    }

    /* ================================================================
       STATUS BAR — permanent bottom strip (time / weather)
    ================================================================ */

    #status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--status-bar-height) * var(--status-bar-scale));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: #000;
      color: rgba(255, 255, 255, 0.4);
      font-size: calc(24px * var(--status-bar-scale));
      font-weight: 300;
      letter-spacing: 2px;
      z-index: 100;
    }

    #status-weather svg {
      width:  calc(32px * var(--status-bar-scale));
      height: calc(32px * var(--status-bar-scale));
      flex-shrink: 0;
    }

    #status-time, #status-weather {
      display: none; /* hidden until JS enables based on profile toggles */
    }

    /* ================================================================
       WEATHER ICON ANIMATIONS
    ================================================================ */

    @keyframes wx-spin  { to { transform: rotate(360deg); } }
    @keyframes wx-drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    @keyframes wx-rain  { from { transform: translateY(0); opacity: .7; } to { transform: translateY(9px); opacity: 0; } }
    @keyframes wx-snow  { 0% { transform: translate(0,0); opacity: .7; } 100% { transform: translate(3px,11px); opacity: 0; } }
    @keyframes wx-fog   { 0%,100% { opacity: .2; } 50% { opacity: .65; } }
    @keyframes wx-flash {
      0%,85%,90%,95%,100% { opacity: .55; }
      86%,91%,96%          { opacity: .05; }
      87%,92%,97%          { opacity: 1;   }
    }

    .wx-spin   { animation: wx-spin  60s linear     infinite; transform-origin: 16px 16px; }
    .wx-drift  { animation: wx-drift  4s ease-in-out infinite; }
    .wx-fog    { animation: wx-fog    2s ease-in-out infinite; }
    .wx-flash  { animation: wx-flash  6s ease-in-out infinite; }
    .wx-rain-1 { animation: wx-rain   1s linear infinite 0s;   }
    .wx-rain-2 { animation: wx-rain   1s linear infinite .33s; }
    .wx-rain-3 { animation: wx-rain   1s linear infinite .66s; }
    .wx-snow-1 { animation: wx-snow   3s ease-in-out infinite 0s; }
    .wx-snow-2 { animation: wx-snow   3s ease-in-out infinite 1s; }
    .wx-snow-3 { animation: wx-snow   3s ease-in-out infinite 2s; }
  </style>
</head>

<body>

  <!-- ── Idle screen ───────────────────────────────────────────────── -->
  <div id="idle-screen" class="screen active">
    <div class="rings">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <div class="idle-content">
      <div class="aura-logo">AURA</div>
      <div class="aura-rule"></div>
      <div class="aura-tagline">Autonomous Vehicle Recognition</div>
    </div>
  </div>

  <!-- ── Recognition screen ───────────────────────────────────────── -->
  <div id="recognition-screen" class="screen">
    <div class="rec-make-model" id="rec-make-model"></div>

    <div class="badge-stage">
      <div class="badge-float">
        <div class="badge-spin">
          <img class="badge-img"        id="rec-badge"   src="" alt="Vehicle badge">
          <img class="badge-reflection" id="rec-reflect" src="" alt="">
        </div>
      </div>
    </div>

    <div class="badge-floor-glow"></div>
    <div class="rec-greeting" id="rec-greeting"></div>
  </div>

  <!-- ── Visitor pre-arrival screen ──────────────────────────────── -->
  <div id="visitor-screen" class="screen">
    <div class="visitor-message" id="visitor-message"></div>
  </div>

  <!-- ── Status bar — always on top, never hidden by screen transitions ── -->
  <div id="status-bar">
    <div id="status-time"></div>
    <div id="status-weather"></div>
  </div>

  <div id="ws-dot"></div>

  <script>
    const idleScreen     = document.getElementById('idle-screen');
    const recScreen      = document.getElementById('recognition-screen');
    const visitorScreen  = document.getElementById('visitor-screen');
    const recMM          = document.getElementById('rec-make-model');
    const recBadge       = document.getElementById('rec-badge');
    const recReflect     = document.getElementById('rec-reflect');
    const recGreeting    = document.getElementById('rec-greeting');
    const visitorMessage = document.getElementById('visitor-message');
    const wsDot          = document.getElementById('ws-dot');

    const WS_URL          = 'ws://localhost:8765';
    const RECONNECT_DELAY = 4000;

    let currentState      = 'idle';
    let reconnectTimer    = null;
    let ws                = null;
    let manualOverride    = false;
    let isVisitorModeActive = false;     // true while visitor pre-arrival/arrival flow is active

    // ── Screen transitions ──────────────────────────────────────────

    function showIdle(force = false) {
      if (!force && manualOverride) return;
      if (currentState === 'idle') return;
      if (!force && isVisitorModeActive) return;
      currentState = 'idle';
      recScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      idleScreen.classList.add('active');
    }

    function showVisitorPreArrival(data) {
      isVisitorModeActive = true;
      currentState = 'visitor_pre_arrival';
      visitorMessage.textContent = data.message || '';
      idleScreen.classList.remove('active');
      recScreen.classList.remove('active');
      visitorScreen.classList.add('active');
    }

    function showVisitorBayOccupied(data) {
      currentState = 'visitor_bay_occupied';
      visitorMessage.textContent = data.message || '';
      idleScreen.classList.remove('active');
      recScreen.classList.remove('active');
      visitorScreen.classList.add('active');
    }

    function showVisitorModeEnded() {
      isVisitorModeActive = false;
      currentState = 'idle';
      recScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      idleScreen.classList.add('active');
    }

    function showRecognition(data) {
      currentState = 'recognition';
      idleScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      recScreen.classList.add('active');

      const parts = [data.make, data.model].filter(Boolean);
      recMM.textContent       = parts.join('  ·  ');
      recGreeting.textContent = data.greeting || '';

      if (data.badge_url) {
        const probe = new Image();
        probe.onload  = () => { applyBadge(data.badge_url); };
        probe.onerror = () => { applyBadge(null); };
        probe.src = data.badge_url;
      } else {
        applyBadge(null);
      }
    }

    function applyBadge(url) {
      if (url) {
        recBadge.src = url;
        recBadge.classList.remove('hidden');
      } else {
        recBadge.classList.add('hidden');
      }
      // Reflection is always hidden (mirror-safe mode)
      recReflect.classList.add('hidden');

      idleScreen.classList.remove('active');
      visitorScreen.classList.remove('active');
      recScreen.classList.add('active');
    }

    // ── Status bar ──────────────────────────────────────────────────

    const statusTime    = document.getElementById('status-time');
    const statusWeather = document.getElementById('status-weather');
    let _timeInterval    = null;
    let _lastWeatherCode = null;

    // ── Weather icon helpers ────────────────────────────────────────

    const _WX_ATTRS = `fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"`;
    const _WX_SVG   = (body) => `<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" ${_WX_ATTRS}>${body}</svg>`;

    // Shared cloud shapes reused across RAIN / SNOW / THUNDERSTORM
    const _CLOUD_SM = `<path d="M3,18 Q3,12 8,12 Q8,8 13,8 Q18,8 20,12 Q26,12 26,16 Q26,18 23,18 Z"/>`;
    const _CLOUD_LG = `<path d="M3,23 Q3,16 9,16 Q9,11 15,11 Q21,11 23,16 Q29,16 29,20 Q29,23 26,23 Z"/>`;

    function getWeatherIcon(code) {
      if (code == null)                    return _wxDefault();
      if (code === 0)                      return _wxClear();
      if (code <= 2)                       return _wxPartlyCloudy();
      if (code === 3)                      return _wxCloudy();
      if (code === 45 || code === 48)     return _wxFog();
      if (code <= 67)                      return _wxRain();
      if (code <= 77)                      return _wxSnow();
      if (code <= 82)                      return _wxRain();
      if (code <= 86)                      return _wxSnow();
      if (code <= 99)                      return _wxThunderstorm();
      return _wxDefault();
    }

    function _wxClear() {
      return _WX_SVG(`<g class="wx-spin">
        <circle cx="16" cy="16" r="5"/>
        <line x1="16" y1="2"    x2="16" y2="8"/>
        <line x1="16" y1="24"   x2="16" y2="30"/>
        <line x1="2"  y1="16"   x2="8"  y2="16"/>
        <line x1="24" y1="16"   x2="30" y2="16"/>
        <line x1="6.1"  y1="6.1"  x2="10.5" y2="10.5"/>
        <line x1="21.5" y1="21.5" x2="25.9" y2="25.9"/>
        <line x1="25.9" y1="6.1"  x2="21.5" y2="10.5"/>
        <line x1="6.1"  y1="25.9" x2="10.5" y2="21.5"/>
      </g>`);
    }

    function _wxPartlyCloudy() {
      // Sun at top-right; cloud (black-filled to occlude rays) drifts below-left
      return _WX_SVG(`
        <circle cx="21" cy="11" r="4"/>
        <line x1="21"   y1="4"    x2="21"   y2="6"/>
        <line x1="21"   y1="16"   x2="21"   y2="18"/>
        <line x1="14"   y1="11"   x2="16"   y2="11"/>
        <line x1="26"   y1="11"   x2="28"   y2="11"/>
        <line x1="15.5" y1="5.5"  x2="17"   y2="7"/>
        <line x1="25"   y1="15"   x2="26.5" y2="16.5"/>
        <line x1="26.5" y1="5.5"  x2="25"   y2="7"/>
        <line x1="15.5" y1="16.5" x2="17"   y2="15"/>
        <g class="wx-drift">
          <path d="M2,26 Q2,20 8,20 Q8,16 13,16 Q19,16 21,20 Q26,20 26,24 Q26,26 22,26 Z"
                fill="#000" stroke="rgba(255,255,255,0.6)"/>
        </g>`);
    }

    function _wxCloudy() {
      return _WX_SVG(`<g class="wx-drift">${_CLOUD_LG}</g>`);
    }

    function _wxFog() {
      return _WX_SVG(`<g class="wx-fog">
        <path d="M3,10 Q8,8  13,10 Q18,12 23,10 Q27,9  31,10"/>
        <path d="M3,17 Q8,15 13,17 Q18,19 23,17 Q27,16 31,17"/>
        <path d="M3,24 Q8,22 13,24 Q18,26 23,24 Q27,23 31,24"/>
      </g>`);
    }

    function _wxRain() {
      return _WX_SVG(`${_CLOUD_SM}
        <line class="wx-rain-1" x1="9"  y1="22" x2="7"  y2="28"/>
        <line class="wx-rain-2" x1="15" y1="22" x2="13" y2="28"/>
        <line class="wx-rain-3" x1="21" y1="22" x2="19" y2="28"/>`);
    }

    function _wxSnow() {
      return _WX_SVG(`${_CLOUD_SM}
        <circle class="wx-snow-1" cx="9"  cy="23" r="1.5" fill="rgba(255,255,255,0.6)" stroke="none"/>
        <circle class="wx-snow-2" cx="15" cy="23" r="1.5" fill="rgba(255,255,255,0.6)" stroke="none"/>
        <circle class="wx-snow-3" cx="21" cy="23" r="1.5" fill="rgba(255,255,255,0.6)" stroke="none"/>`);
    }

    function _wxThunderstorm() {
      const cloud = `<path d="M3,17 Q3,11 8,11 Q8,7 13,7 Q18,7 20,11 Q26,11 26,15 Q26,17 23,17 Z"/>`;
      const bolt  = `<path class="wx-flash" d="M18,19 L13,25 L17,25 L15,31 L22,22 L17,22 Z" fill="rgba(255,255,255,0.6)" stroke="none"/>`;
      return _WX_SVG(cloud + bolt);
    }

    function _wxDefault() {
      return _WX_SVG(`<circle cx="16" cy="16" r="12"/>`);
    }

    function updateStatusBar(msg) {
      // Scale
      if (msg.status_bar_scale != null) {
        document.documentElement.style.setProperty(
          '--status-bar-scale',
          (msg.status_bar_scale / 100).toFixed(2)
        );
      }

      // Time
      if (msg.show_time) {
        statusTime.style.display = 'block'; // FIX: '' falls back to CSS display:none
        clearInterval(_timeInterval);
        const _DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const _MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        function _ordinal(d) {
          if (d >= 11 && d <= 13) return d + 'th';
          switch (d % 10) {
            case 1: return d + 'st';
            case 2: return d + 'nd';
            case 3: return d + 'rd';
            default: return d + 'th';
          }
        }
        function _tick() {
          const now     = new Date();
          const datePart = _DAYS[now.getDay()] + ' ' + _ordinal(now.getDate()) + ' ' + _MONTHS[now.getMonth()];
          let timePart;
          if (msg.time_format === '12h') {
            const h    = now.getHours() % 12 || 12;
            const m    = String(now.getMinutes()).padStart(2, '0');
            const ampm = now.getHours() < 12 ? 'AM' : 'PM';
            timePart = `${h}:${m} ${ampm}`;
          } else {
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            timePart = `${h}:${m}`;
          }
          statusTime.textContent = `${datePart} · ${timePart}`;
        }
        _tick();
        _timeInterval = setInterval(_tick, 1000);
      } else {
        clearInterval(_timeInterval);
        _timeInterval = null;
        statusTime.style.display = 'none';
        statusTime.textContent   = '';
      }

      // Weather
      if (msg.show_weather && msg.temp_c != null) {
        statusWeather.style.display    = 'inline-flex';
        statusWeather.style.alignItems = 'center';
        statusWeather.style.gap        = '8px';
        const tempStr = msg.units === 'imperial'
          ? Math.round(msg.temp_c * 9 / 5 + 32) + '°F'
          : Math.round(msg.temp_c) + '°C';
        const code = (msg.weather_code != null) ? msg.weather_code : null;
        if (code !== _lastWeatherCode) {
          // Code changed — re-render icon (restarts animations intentionally)
          _lastWeatherCode = code;
          statusWeather.innerHTML = getWeatherIcon(code) + `<span>${tempStr}</span>`;
        } else {
          // Same code — update temperature text only, preserving running animations
          const span = statusWeather.querySelector('span');
          if (span) span.textContent = tempStr;
          else statusWeather.innerHTML = getWeatherIcon(code) + `<span>${tempStr}</span>`;
        }
      } else {
        _lastWeatherCode = null;
        statusWeather.style.display = 'none';
        statusWeather.innerHTML     = '';
      }
    }

    // ── Spacebar test mode ──────────────────────────────────────────

    document.addEventListener('keydown', (e) => {
      if (e.code !== 'Space') return;
      e.preventDefault();
      if (currentState !== 'idle') {
        manualOverride = false;
        showIdle(true);
      } else {
        manualOverride = true;
        currentState = 'recognition';
        recMM.textContent       = 'Land Rover  ·  Evoque';
        recGreeting.textContent = 'Welcome back, Kieron';
        applyBadge('http://localhost:8080/assets/badges/land-rover.png');
      }
    });

    // ── WebSocket ───────────────────────────────────────────────────

    function connect() {
      clearTimeout(reconnectTimer);
      wsDot.className = 'reconnecting';

      ws = new WebSocket(WS_URL);

      ws.addEventListener('open', () => {
        wsDot.className = 'connected';
        isVisitorModeActive = false;
      });

      ws.addEventListener('message', ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { return; }
        if (msg.state === 'recognition') {
          showRecognition(msg);
        } else if (msg.state === 'status_bar') {
          updateStatusBar(msg);
        } else if (msg.state === 'visitor_pre_arrival') {
          showVisitorPreArrival(msg);
        } else if (msg.state === 'visitor_bay_occupied') {
          showVisitorBayOccupied(msg);
        } else if (msg.state === 'visitor_mode_ended') {
          showVisitorModeEnded();
        } else {
          showIdle();
        }
      });

      ws.addEventListener('close', () => {
        wsDot.className = 'reconnecting';
        showIdle();
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
      });

      ws.addEventListener('error', () => {
        wsDot.className = 'error';
        ws.close();
      });
    }

    connect();
  </script>
</body>
